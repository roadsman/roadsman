<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.22" stop-color="#ffffff" stop-opacity="0.9"/>
<stop offset="0.78" stop-color="#ffffff" stop-opacity="0.9"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.25" stop-color="#ffffff" stop-opacity="0.22"/>
<stop offset="0.75" stop-color="#ffffff" stop-opacity="0.22"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="asphalt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.045"/>
